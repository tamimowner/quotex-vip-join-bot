<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VIP Bot Admin</title>
<style>
:root{--bg:#0f1419;--card:#1a2332;--border:#2d3a4f;--text:#e7ecf3;--muted:#8b9bb4;--accent:#3b82f6;--ok:#22c55e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:#121a24}
header h1{margin:0;font-size:1.05rem}
#authStatus{font-size:.85rem;color:var(--muted)}
#authStatus.ok{color:#86efac}
#authStatus.err{color:#fca5a5}
input,select,textarea,button{font:inherit;border-radius:8px;border:1px solid var(--border);background:#0d1218;color:var(--text);padding:8px 12px}
button{cursor:pointer;background:var(--accent);border-color:transparent;font-weight:600}
button.secondary{background:#243044}
button.ok{background:var(--ok);color:#052e16}
button.danger{background:#991b1b}
button:disabled{opacity:.6}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border)}
nav button.tab{background:transparent;border:1px solid var(--border)}
nav button.tab.active{background:var(--accent)}
main{padding:14px 16px 40px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px}
.grid.2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:10px}
textarea{width:100%;min-height:140px;font-family:ui-monospace,monospace;font-size:.85rem}
.preview{background:#0b0f14;border:1px dashed var(--border);border-radius:10px;padding:12px;min-height:80px;line-height:1.5}
.muted{color:var(--muted);font-size:.85rem}
.stat{font-size:1.35rem;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
.toast{position:fixed;bottom:16px;right:16px;background:#14532d;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.emoji-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.emoji-bar button{background:#1e293b;border:1px solid var(--border);padding:6px 10px}
.gate{max-width:400px;margin:48px auto;padding:0 16px}
.gate h2{margin:0 0 6px;text-align:center}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:16px}
.login-box input{width:100%}
#loginErr{background:#450a0a;border:1px solid #991b1b;color:#fecaca;padding:10px 12px;border-radius:8px;margin-top:12px;font-size:.85rem;display:none;word-break:break-word}
.raw{font-size:.7rem;color:var(--muted);max-width:220px;word-break:break-all}
</style>
</head>
<body>
<header>
  <div>
    <h1>VIP Bot Admin</h1>
    <div id="authStatus">Ready</div>
  </div>
  <div class="row">
    <button type="button" id="btnLoad" class="secondary">Reload</button>
    <button type="button" id="btnLogout" class="danger hidden">Logout</button>
  </div>
</header>

<div id="gate" class="gate">
  <h2>Admin Login</h2>
  <p class="muted" style="text-align:center" id="gateMsg">Username and Password</p>
  <div class="login-box">
    <div class="field">
      <label>Username</label>
      <input id="loginUser" autocomplete="username" value="admin" />
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPass" type="password" autocomplete="current-password" />
    </div>
    <button type="button" class="ok" id="btnLogin" style="width:100%;margin-top:8px">Login</button>
    <div id="loginErr"></div>
    <p class="muted" style="margin:14px 0 0;font-size:.78rem">Railway: ADMIN_USERNAME + ADMIN_PASSWORD</p>
  </div>
</div>

<div id="app" class="hidden">
<nav>
  <button type="button" class="tab active" data-tab="links">Links</button>
  <button type="button" class="tab" data-tab="buttons">Buttons</button>
  <button type="button" class="tab" data-tab="messages">Messages</button>
  <button type="button" class="tab" data-tab="ai">AI</button>
  <button type="button" class="tab" data-tab="stats">Stats</button>
</nav>
<main>
  <section id="tab-links" class="panel">
    <div class="card grid 2">
      <div class="field"><label>Affiliate link</label><input id="affiliate_link_base" style="width:100%" /></div>
      <div class="field"><label>VIP invite link</label><input id="vip_group_link" style="width:100%" /></div>
      <div class="field"><label>Min deposit ($)</label><input id="min_deposit" type="number" min="0" step="1" /></div>
      <div class="field"><label>Public channel</label><input id="public_channel" style="width:100%" /></div>
      <div class="field"><label>Site ID</label><input id="site_id" /></div>
      <div class="field"><label>Welcome photo URL</label><input id="welcome_photo_url" style="width:100%" /></div>
    </div>
    <p class="muted" id="affiliate_preview"></p>
    <button type="button" class="ok" id="btnSaveLinks">Save links</button>
  </section>
  <section id="tab-buttons" class="panel hidden">
    <div class="card" id="buttonsBox"></div>
    <button type="button" class="ok" id="btnSaveButtons">Save buttons</button>
  </section>
  <section id="tab-messages" class="panel hidden">
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <div class="field" style="flex:1;min-width:140px"><label>Key</label><select id="msgKey"></select></div>
        <div class="field"><label>Lang</label>
          <select id="msgLang"><option value="bn">BN</option><option value="en">EN</option></select>
        </div>
      </div>
      <div class="emoji-bar" id="emojiBar"></div>
      <div class="field"><label>HTML</label><textarea id="msgValue"></textarea></div>
      <div class="field"><label>Preview</label><div class="preview" id="msgPreview"></div></div>
      <p class="muted" id="msgSource"></p>
      <div class="row">
        <button type="button" class="ok" id="btnSaveMsg">Save</button>
        <button type="button" class="secondary" id="btnWrapBold">b</button>
        <button type="button" class="secondary" id="btnWrapCode">code</button>
      </div>
    </div>
  </section>
  <section id="tab-ai" class="panel hidden">
    <div class="card grid 2">
      <div class="field"><label>Topic</label><input id="aiTopic" value="VIP Join" /></div>
      <div class="field"><label>Lang</label>
        <select id="aiLang"><option value="bn">BN</option><option value="en">EN</option></select>
      </div>
      <div class="field"><label>Tone</label>
        <select id="aiTone"><option value="friendly">Friendly</option><option value="pro">Pro</option><option value="hype">Hype</option></select>
      </div>
      <div class="field"><label><input type="checkbox" id="aiPrem" checked /> Premium emoji</label></div>
    </div>
    <button type="button" id="btnAiGen">Generate</button>
    <div class="card" style="margin-top:12px">
      <textarea id="aiOut"></textarea>
      <div class="preview" id="aiPreview" style="margin-top:8px"></div>
      <button type="button" class="secondary" id="btnAiToWelcome" style="margin-top:8px">to welcome</button>
    </div>
  </section>
  <section id="tab-stats" class="panel hidden">
    <div class="card grid 2" id="statsBox"></div>
    <div class="card">
      <h3 style="margin:0 0 8px;font-size:.95rem">Recent postbacks</h3>
      <p class="muted" id="pbHint">-</p>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Time</th><th>Status</th><th>Trader</th><th>CID</th><th>Dep</th><th>Raw</th></tr></thead>
        <tbody id="pbBody"></tbody>
      </table></div>
    </div>
    <div class="card">
      <h3 style="margin:0 0 8px;font-size:.95rem">Recent users</h3>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>TG</th><th>Name</th><th>Trader</th><th>Dep</th><th>OK</th><th>Join</th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table></div>
    </div>
  </section>
</main>
</div>

<div class="toast" id="toast"></div>

<script>
window.__adminBootError = null;
try {
(function () {
  function el(id) {
    var n = document.getElementById(id);
    if (!n) throw new Error("Missing element: " + id);
    return n;
  }

  var BUTTON_KEYS = [
    "btn_premium", "btn_create_account", "btn_delete_account", "btn_public",
    "btn_status", "btn_support", "btn_register", "btn_back", "btn_settings"
  ];

  var sessionKey = localStorage.getItem("admin_session") || "";
  var messagesCache = {};

  function toast(msg) {
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(function () { t.style.display = "none"; }, 2200);
  }

  function showLoginError(msg) {
    var box = document.getElementById("loginErr");
    if (!box) return;
    if (msg) {
      box.style.display = "block";
      box.textContent = msg;
    } else {
      box.style.display = "none";
      box.textContent = "";
    }
  }

  function apiBase() {
    // page is /admin or /admin/
    var p = window.location.pathname || "/admin";
    if (p.length > 1 && p.charAt(p.length - 1) === "/") p = p.slice(0, -1);
    if (p.indexOf("/admin") === -1) return "/admin";
    return p;
  }

  function fetchJson(url, opts) {
    opts = opts || {};
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 20000);
    opts.signal = ctrl.signal;
    return fetch(url, opts).then(function (res) {
      return res.text().then(function (text) {
        var data = {};
        try { data = text ? JSON.parse(text) : {}; } catch (e) { data = { detail: text.slice(0, 200) }; }
        return { res: res, data: data };
      });
    }).finally(function () { clearTimeout(timer); });
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = { "Content-Type": "application/json" };
    if (opts.headers) {
      for (var k in opts.headers) headers[k] = opts.headers[k];
    }
    if (sessionKey) headers["X-Admin-Session"] = sessionKey;
    opts.headers = headers;
    return fetchJson(apiBase() + path, opts).then(function (r) {
      if (r.res.status === 401 || r.res.status === 403) {
        throw new Error(r.data.detail || "Unauthorized");
      }
      if (!r.res.ok) {
        var d = r.data.detail;
        if (typeof d === "object") d = JSON.stringify(d);
        throw new Error(d || r.res.statusText || "Request failed");
      }
      return r.data;
    });
  }

  function renderTgHtml(html) {
    // Avoid HTML entities in source — use DOM text then allow a few tags
    var div = document.createElement("div");
    div.textContent = String(html || "");
    var s = div.innerHTML;
    s = s.replace(/<(\/?)(b|strong|i|em|u|s|code|pre)\s*>/gi, "<$1$2>");
    s = s.replace(/<tg-emoji[^&]*>([^&]*)<\/tg-emoji>/gi, "<span>$1</span>");
    s = s.replace(/\n/g, "<br>");
    return s;
  }

  function insertAtCursor(ta, text) {
    var a = ta.selectionStart || 0;
    var b = ta.selectionEnd || 0;
    var v = ta.value;
    ta.value = v.slice(0, a) + text + v.slice(b);
    ta.focus();
    ta.dispatchEvent(new Event("input"));
  }

  function setupEmojiBar() {
    var bar = document.getElementById("emojiBar");
    if (!bar || bar.childNodes.length) return;
    var samples = [
      { id: "5188481279963715781", fb: "W" },
      { id: "5879757713658875847", fb: "*" },
      { id: "5215174853895660531", fb: "!" }
    ];
    samples.forEach(function (e) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = e.fb;
      btn.onclick = function () {
        insertAtCursor(el("msgValue"), "<tg-emoji emoji-id=\"" + e.id + "\">" + e.fb + "</tg-emoji> ");
      };
      bar.appendChild(btn);
    });
  }

  document.querySelectorAll("nav .tab").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("nav .tab").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      document.querySelectorAll(".panel").forEach(function (p) { p.classList.add("hidden"); });
      document.getElementById("tab-" + btn.dataset.tab).classList.remove("hidden");
    });
  });

  function fillLinks(data) {
    el("affiliate_link_base").value = data.affiliate_link_base || "";
    el("vip_group_link").value = data.vip_group_link || "";
    el("min_deposit").value = data.min_deposit || "0";
    el("public_channel").value = data.public_channel || "";
    el("site_id").value = data.site_id || "1";
    el("welcome_photo_url").value = data.welcome_photo_url || "";
    el("affiliate_preview").textContent = "Preview: " + (data.affiliate_link_preview || "");
  }

  function fillButtons(data) {
    var box = el("buttonsBox");
    box.innerHTML = "";
    BUTTON_KEYS.forEach(function (k) {
      var wrap = document.createElement("div");
      wrap.className = "card";
      var title = document.createElement("strong");
      title.textContent = k;
      wrap.appendChild(title);

      var grid = document.createElement("div");
      grid.className = "grid 2";
      grid.style.marginTop = "8px";

      function addField(labelText, dataK, val, isSelect) {
        var f = document.createElement("div");
        f.className = "field";
        var lab = document.createElement("label");
        lab.textContent = labelText;
        f.appendChild(lab);
        var input;
        if (isSelect) {
          input = document.createElement("select");
          ["primary", "success", "danger"].forEach(function (opt) {
            var o = document.createElement("option");
            o.value = opt;
            o.textContent = opt;
            if (opt === val) o.selected = true;
            input.appendChild(o);
          });
        } else {
          input = document.createElement("input");
          input.value = val || "";
          input.style.width = "100%";
        }
        input.setAttribute("data-k", dataK);
        f.appendChild(input);
        grid.appendChild(f);
      }

      addField("BN", k + "_bn", data.buttons[k + "_bn"] || "", false);
      addField("EN", k + "_en", data.buttons[k + "_en"] || "", false);
      addField("Style", "style_" + k, data.buttons["style_" + k] || "primary", true);
      addField("Emoji id", "icon_" + k, data.buttons["icon_" + k] || "", false);
      wrap.appendChild(grid);
      box.appendChild(wrap);
    });
  }

  el("btnSaveLinks").onclick = function () {
    api("/api/settings/bulk", {
      method: "POST",
      body: JSON.stringify({
        items: {
          affiliate_link_base: el("affiliate_link_base").value,
          vip_group_link: el("vip_group_link").value,
          min_deposit: el("min_deposit").value,
          public_channel: el("public_channel").value,
          site_id: el("site_id").value,
          welcome_photo_url: el("welcome_photo_url").value
        }
      })
    }).then(function () { toast("Saved"); }).catch(function (e) { alert(e.message); });
  };

  el("btnSaveButtons").onclick = function () {
    var items = {};
    document.querySelectorAll("#buttonsBox [data-k]").forEach(function (node) {
      items[node.getAttribute("data-k")] = node.value;
    });
    api("/api/settings/bulk", {
      method: "POST",
      body: JSON.stringify({ items: items })
    }).then(function () { toast("Saved"); }).catch(function (e) { alert(e.message); });
  };

  function loadMsgEditor() {
    var sk = "msg_" + el("msgKey").value + "_" + el("msgLang").value;
    el("msgValue").value = messagesCache[sk] || "";
    el("msgSource").textContent = "Source: " + (messagesCache[sk + "__source"] || "-");
    el("msgPreview").innerHTML = renderTgHtml(el("msgValue").value);
  }
  el("msgKey").onchange = loadMsgEditor;
  el("msgLang").onchange = loadMsgEditor;
  el("msgValue").oninput = function () {
    el("msgPreview").innerHTML = renderTgHtml(el("msgValue").value);
  };

  el("btnWrapBold").onclick = function () {
    var ta = el("msgValue");
    var a = ta.selectionStart, b = ta.selectionEnd;
    var sel = ta.value.slice(a, b) || "text";
    ta.value = ta.value.slice(0, a) + "<b>" + sel + "</b>" + ta.value.slice(b);
    ta.dispatchEvent(new Event("input"));
  };
  el("btnWrapCode").onclick = function () {
    var ta = el("msgValue");
    var a = ta.selectionStart, b = ta.selectionEnd;
    var sel = ta.value.slice(a, b) || "code";
    ta.value = ta.value.slice(0, a) + "<code>" + sel + "</code>" + ta.value.slice(b);
    ta.dispatchEvent(new Event("input"));
  };
  el("btnSaveMsg").onclick = function () {
    api("/api/messages", {
      method: "POST",
      body: JSON.stringify({
        key: el("msgKey").value,
        lang: el("msgLang").value,
        value: el("msgValue").value
      })
    }).then(function () { toast("Saved"); return loadAll(); }).catch(function (e) { alert(e.message); });
  };

  el("btnAiGen").onclick = function () {
    api("/api/ai/caption", {
      method: "POST",
      body: JSON.stringify({
        topic: el("aiTopic").value,
        lang: el("aiLang").value,
        tone: el("aiTone").value,
        include_tg_emoji: el("aiPrem").checked
      })
    }).then(function (data) {
      el("aiOut").value = data.html || "";
      el("aiPreview").innerHTML = renderTgHtml(data.html || "");
      toast("OK");
    }).catch(function (e) { alert(e.message); });
  };
  el("aiOut").oninput = function () {
    el("aiPreview").innerHTML = renderTgHtml(el("aiOut").value);
  };
  el("btnAiToWelcome").onclick = function () {
    document.querySelector('[data-tab="messages"]').click();
    el("msgKey").value = "welcome";
    el("msgLang").value = el("aiLang").value;
    el("msgValue").value = el("aiOut").value;
    loadMsgEditor();
  };

  function loadStats() {
    return api("/api/stats").then(function (s) {
      el("statsBox").innerHTML =
        "<div><div class=\"muted\">Users</div><div class=\"stat\">" + s.total_users + "</div></div>" +
        "<div><div class=\"muted\">Verified</div><div class=\"stat\">" + s.verified + "</div></div>" +
        "<div><div class=\"muted\">Joined</div><div class=\"stat\">" + s.joined + "</div></div>" +
        "<div><div class=\"muted\">Postbacks</div><div class=\"stat\">" + s.postbacks + "</div></div>";
      return api("/api/postbacks?limit=40");
    }).then(function (pb) {
      var list = pb.postbacks || [];
      el("pbHint").textContent = list.length ? ("Last " + list.length + " hits") : "No postbacks yet";
      el("pbBody").innerHTML = list.map(function (x) {
        var t = (x.created_at || "").replace("T", " ").slice(0, 19);
        var raw = (x.raw_data || "").slice(0, 80);
        return "<tr><td>" + t + "</td><td>" + (x.status || "-") +
          "</td><td>" + (x.trader_id || "-") + "</td><td>" + (x.click_id || "-") +
          "</td><td>$" + Number(x.sumdep || 0).toFixed(2) +
          "</td><td class=\"raw\">" + String(raw).replace(/</g, " ") + "</td></tr>";
      }).join("") || "<tr><td colspan=\"6\">Empty</td></tr>";
      return api("/api/users?limit=40");
    }).then(function (u) {
      el("usersBody").innerHTML = (u.users || []).map(function (x) {
        return "<tr><td><code>" + x.telegram_id + "</code></td><td>" +
          String(x.full_name || x.username || "-").replace(/</g, " ") + "</td><td>" +
          (x.trader_id || "-") + "</td><td>$" + Number(x.total_deposit || 0).toFixed(2) +
          "</td><td>" + (x.is_verified ? "Yes" : "No") +
          "</td><td>" + (x.has_joined ? "Yes" : "No") + "</td></tr>";
      }).join("");
    });
  }

  function loadAll() {
    return api("/api/settings").then(function (data) {
      fillLinks(data);
      fillButtons(data);
      return api("/api/messages");
    }).then(function (msgs) {
      messagesCache = msgs.messages || {};
      var sel = el("msgKey");
      sel.innerHTML = "";
      (msgs.keys || []).forEach(function (k) {
        var o = document.createElement("option");
        o.value = k;
        o.textContent = k;
        sel.appendChild(o);
      });
      setupEmojiBar();
      loadMsgEditor();
      return loadStats();
    }).then(function () { toast("Loaded"); });
  }

  function showApp(name) {
    el("authStatus").textContent = "Logged in: " + name;
    el("authStatus").className = "ok";
    el("gate").classList.add("hidden");
    el("app").classList.remove("hidden");
    el("btnLogout").classList.remove("hidden");
    showLoginError("");
  }

  function showGate(msg) {
    el("authStatus").textContent = msg || "Login";
    el("authStatus").className = "err";
    if (msg) el("gateMsg").textContent = msg;
    el("gate").classList.remove("hidden");
    el("app").classList.add("hidden");
    el("btnLogout").classList.add("hidden");
  }

  function doLogin() {
    var username = (el("loginUser").value || "").trim();
    var password = el("loginPass").value || "";
    if (!username || !password) {
      showLoginError("Username and Password required");
      return;
    }
    var btn = el("btnLogin");
    btn.disabled = true;
    btn.textContent = "Logging in...";
    el("authStatus").textContent = "Logging in...";
    showLoginError("");

    var url = apiBase() + "/api/auth/login";
    fetchJson(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: password })
    }).then(function (r) {
      if (!r.res.ok) {
        var d = r.data.detail;
        if (Array.isArray(d)) {
          d = d.map(function (x) { return x.msg || JSON.stringify(x); }).join("; ");
        }
        throw new Error(d || ("HTTP " + r.res.status));
      }
      if (!r.data.session) throw new Error("No session in response");
      sessionKey = r.data.session;
      localStorage.setItem("admin_session", sessionKey);
      localStorage.setItem("admin_user", username);
      showApp(username);
      return loadAll();
    }).catch(function (e) {
      var msg = (e && e.name === "AbortError") ? "Server timeout" : (e.message || String(e));
      showGate("Login failed");
      showLoginError(msg + " | url=" + url);
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = "Login";
    });
  }

  function doLogout() {
    sessionKey = "";
    localStorage.removeItem("admin_session");
    showGate("Logged out");
  }

  function boot() {
    var savedUser = localStorage.getItem("admin_user") || "admin";
    el("loginUser").value = savedUser;

    if (sessionKey) {
      api("/api/ping").then(function (p) {
        showApp(p.user || savedUser);
        return loadAll();
      }).catch(function () {
        localStorage.removeItem("admin_session");
        sessionKey = "";
        showGate("Username and Password");
      });
      return;
    }
    showGate("Username and Password");
  }

  el("btnLogin").addEventListener("click", function (ev) {
    ev.preventDefault();
    doLogin();
  });
  el("loginPass").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); doLogin(); }
  });
  el("loginUser").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); doLogin(); }
  });
  el("btnLogout").addEventListener("click", doLogout);
  el("btnLoad").addEventListener("click", function () {
    loadAll().catch(function (e) { alert(e.message); });
  });

  boot();
})();
} catch (err) {
  window.__adminBootError = String(err && err.message ? err.message : err);
  var box = document.getElementById("loginErr");
  if (box) {
    box.style.display = "block";
    box.textContent = "JS ERROR: " + window.__adminBootError;
  }
  var st = document.getElementById("authStatus");
  if (st) st.textContent = "JS ERROR";
}
</script>
</body>
</html>
