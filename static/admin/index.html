<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VIP Bot Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f1419; --card: #1a2332; --border: #2d3a4f;
    --text: #e7ecf3; --muted: #8b9bb4; --accent: #3b82f6; --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
    background: #121a24;
  }
  header h1 { margin: 0; font-size: 1.05rem; }
  #authStatus { font-size: 0.8rem; color: var(--muted); max-width: 70vw; word-break: break-word; }
  #authStatus.ok { color: #86efac; }
  #authStatus.err { color: #fca5a5; }
  input, select, textarea, button {
    font: inherit; border-radius: 8px; border: 1px solid var(--border);
    background: #0d1218; color: var(--text); padding: 8px 12px;
  }
  button { cursor: pointer; background: var(--accent); border-color: transparent; font-weight: 600; }
  button.secondary { background: #243044; }
  button.ok { background: var(--ok); color: #052e16; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  nav button.tab { background: transparent; border: 1px solid var(--border); }
  nav button.tab.active { background: var(--accent); }
  main { padding: 14px 16px 40px; max-width: 1100px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .grid { display: grid; gap: 12px; }
  .grid.2 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  .field { margin-bottom: 10px; }
  textarea { width: 100%; min-height: 140px; font-family: ui-monospace, monospace; font-size: 0.85rem; }
  .preview { background: #0b0f14; border: 1px dashed var(--border); border-radius: 10px; padding: 12px; min-height: 80px; line-height: 1.5; }
  .preview b { font-weight: 700; color: #fff; }
  .preview code { background: #1e293b; padding: 1px 5px; border-radius: 4px; }
  .preview .tg-e { font-size: 1.2em; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .stat { font-size: 1.35rem; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; }
  .badge.ok { background: #14532d; color: #86efac; }
  .badge.no { background: #44403c; color: #d6d3d1; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: #14532d; color: #fff; padding: 10px 16px; border-radius: 8px; display: none; z-index: 99; }
  .hidden { display: none !important; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .emoji-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .emoji-bar button { background: #1e293b; border: 1px solid var(--border); padding: 6px 10px; font-size: 1.1rem; }
  .gate { padding: 32px 18px; text-align: center; }
  .gate h2 { margin: 0 0 12px; }
  .gate code { background: #1e293b; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🛠 VIP Bot — Web Admin</h1>
    <div id="authStatus">Checking Telegram…</div>
  </div>
  <div class="row">
    <button type="button" id="btnAuth" class="secondary">Login</button>
    <button type="button" id="btnLoad" class="secondary">Reload</button>
  </div>
</header>

<div id="gate" class="gate hidden">
  <h2>⛔ Admin login</h2>
  <p class="muted" id="gateMsg">Open from bot: /admin → Web App</p>
  <p class="muted" style="margin-top:16px">Railway এ <code>ADMIN_IDS</code> = আপনার Telegram numeric ID থাকতে হবে।</p>
  <button type="button" id="btnRetry" style="margin-top:16px">Try again</button>
</div>

<div id="app" class="hidden">
<nav>
  <button type="button" class="tab active" data-tab="links">Links & Deposit</button>
  <button type="button" class="tab" data-tab="buttons">Buttons</button>
  <button type="button" class="tab" data-tab="messages">Messages</button>
  <button type="button" class="tab" data-tab="ai">AI</button>
  <button type="button" class="tab" data-tab="stats">Stats</button>
</nav>
<main>
  <section id="tab-links" class="panel">
    <div class="card grid 2">
      <div class="field"><label>Affiliate link</label><input id="affiliate_link_base" style="width:100%" /></div>
      <div class="field"><label>VIP invite link</label><input id="vip_group_link" style="width:100%" /></div>
      <div class="field"><label>Min deposit ($)</label><input id="min_deposit" type="number" min="0" step="1" /></div>
      <div class="field"><label>Public channel</label><input id="public_channel" style="width:100%" /></div>
      <div class="field"><label>Site ID</label><input id="site_id" /></div>
      <div class="field"><label>Welcome photo URL</label><input id="welcome_photo_url" style="width:100%" /></div>
    </div>
    <p class="muted" id="affiliate_preview"></p>
    <button type="button" class="ok" id="btnSaveLinks">Save links</button>
  </section>

  <section id="tab-buttons" class="panel hidden">
    <div class="card" id="buttonsBox"></div>
    <button type="button" class="ok" id="btnSaveButtons">Save buttons</button>
  </section>

  <section id="tab-messages" class="panel hidden">
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <div class="field" style="flex:1;min-width:140px"><label>Key</label><select id="msgKey"></select></div>
        <div class="field"><label>Lang</label>
          <select id="msgLang"><option value="bn">বাংলা</option><option value="en">EN</option></select>
        </div>
      </div>
      <div class="emoji-bar" id="emojiBar"></div>
      <div class="field"><label>HTML</label><textarea id="msgValue"></textarea></div>
      <div class="field"><label>Preview</label><div class="preview" id="msgPreview"></div></div>
      <p class="muted" id="msgSource"></p>
      <div class="row">
        <button type="button" class="ok" id="btnSaveMsg">Save</button>
        <button type="button" class="secondary" id="btnWrapBold">b</button>
        <button type="button" class="secondary" id="btnWrapCode">code</button>
      </div>
    </div>
  </section>

  <section id="tab-ai" class="panel hidden">
    <div class="card grid 2">
      <div class="field"><label>Topic</label><input id="aiTopic" value="VIP Join" /></div>
      <div class="field"><label>Lang</label>
        <select id="aiLang"><option value="bn">বাংলা</option><option value="en">EN</option></select>
      </div>
      <div class="field"><label>Tone</label>
        <select id="aiTone"><option value="friendly">Friendly</option><option value="pro">Pro</option><option value="hype">Hype</option></select>
      </div>
      <div class="field"><label><input type="checkbox" id="aiPrem" checked /> Premium emoji</label></div>
    </div>
    <button type="button" id="btnAiGen">Generate</button>
    <div class="card" style="margin-top:12px">
      <textarea id="aiOut"></textarea>
      <div class="preview" id="aiPreview" style="margin-top:8px"></div>
      <button type="button" class="secondary" id="btnAiToWelcome" style="margin-top:8px">→ welcome</button>
    </div>
  </section>

  <section id="tab-stats" class="panel hidden">
    <div class="card grid 2" id="statsBox"></div>
    <div class="card">
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>TG</th><th>Name</th><th>Trader</th><th>Dep</th><th>OK</th><th>Join</th></tr></thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>
</div>

<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const BUTTON_KEYS = [
  "btn_premium","btn_create_account","btn_delete_account","btn_public",
  "btn_status","btn_support","btn_register","btn_back","btn_settings"
];
const TG_EMOJI_SAMPLES = [
  { id: "5188481279963715781", fb: "👋" },
  { id: "5879757713658875847", fb: "✨" },
  { id: "5215174853895660531", fb: "📢" },
  { id: "6300954126901577963", fb: "👇" },
  { id: "5397782960512444700", fb: "📌" },
  { id: "5420323339723881652", fb: "⚠️" },
];
let sessionKey = localStorage.getItem("admin_session") || "";
let messagesCache = {};

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => (el.style.display = "none"), 2200);
}

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

async function fetchJson(url, opts = {}, timeoutMs = 12000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...opts, signal: ctrl.signal });
    const data = await res.json().catch(() => ({}));
    return { res, data };
  } finally {
    clearTimeout(t);
  }
}

async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (sessionKey) headers["X-Admin-Session"] = sessionKey;
  const { res, data } = await fetchJson("/admin" + path, { ...opts, headers });
  if (res.status === 401 || res.status === 403) throw new Error(data.detail || "Unauthorized");
  if (!res.ok) throw new Error(data.detail || res.statusText || "Request failed");
  return data;
}

function getTg() {
  try {
    return (window.Telegram && window.Telegram.WebApp) || null;
  } catch (_) {
    return null;
  }
}

function getInitData() {
  const tg = getTg();
  if (!tg) return "";
  try { tg.ready(); tg.expand(); } catch (_) {}
  return (tg.initData || "").trim();
}

async function waitInitData(maxMs = 2500) {
  const start = Date.now();
  let data = getInitData();
  while (!data && Date.now() - start < maxMs) {
    await sleep(200);
    data = getInitData();
  }
  return data;
}

function renderTgHtml(html) {
  let s = String(html || "")
    .replace(/&/g, "&")
    .replace(/</g, "<")
    .replace(/>/g, ">");
  s = s.replace(/<(\/?)(b|strong|i|em|u|s|code|pre)\s*>/gi, "<$1$2>");
  s = s.replace(
    /<tg-emoji\s+emoji-id=(?:"|"|')(\d+)(?:"|"|')\s*>([^&]*)<\/tg-emoji>/gi,
    function (_, id, fb) { return '<span class="tg-e">' + (fb || "⭐") + "</span>"; }
  );
  return s.replace(/\n/g, "<br>");
}

function insertAtCursor(ta, text) {
  const a = ta.selectionStart || 0, b = ta.selectionEnd || 0, v = ta.value;
  ta.value = v.slice(0, a) + text + v.slice(b);
  ta.focus();
  ta.dispatchEvent(new Event("input"));
}

function setupEmojiBar() {
  const bar = $("emojiBar");
  if (!bar || bar.childNodes.length) return;
  TG_EMOJI_SAMPLES.forEach((e) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = e.fb;
    btn.onclick = () => insertAtCursor($("msgValue"), '<tg-emoji emoji-id="' + e.id + '">' + e.fb + "</tg-emoji> ");
    bar.appendChild(btn);
  });
}

document.querySelectorAll("nav .tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav .tab").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".panel").forEach((p) => p.classList.add("hidden"));
    $("tab-" + btn.dataset.tab).classList.remove("hidden");
  });
});

function fillLinks(data) {
  $("affiliate_link_base").value = data.affiliate_link_base || "";
  $("vip_group_link").value = data.vip_group_link || "";
  $("min_deposit").value = data.min_deposit || "0";
  $("public_channel").value = data.public_channel || "";
  $("site_id").value = data.site_id || "1";
  $("welcome_photo_url").value = data.welcome_photo_url || "";
  $("affiliate_preview").textContent = "Preview: " + (data.affiliate_link_preview || "");
}
function fillButtons(data) {
  const box = $("buttonsBox");
  box.innerHTML = "";
  BUTTON_KEYS.forEach((k) => {
    const bn = (data.buttons[k + "_bn"] || "").replace(/"/g, """);
    const en = (data.buttons[k + "_en"] || "").replace(/"/g, """);
    const style = data.buttons["style_" + k] || "primary";
    const icon = data.buttons["icon_" + k] || "";
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = "<strong>" + k + "</strong>" +
      '<div class="grid 2" style="margin-top:8px">' +
      '<div class="field"><label>BN</label><input data-k="' + k + '_bn" value="' + bn + '" style="width:100%"></div>' +
      '<div class="field"><label>EN</label><input data-k="' + k + '_en" value="' + en + '" style="width:100%"></div>' +
      '<div class="field"><label>Style</label><select data-k="style_' + k + '">' +
      '<option value="primary"' + (style === "primary" ? " selected" : "") + '>primary</option>' +
      '<option value="success"' + (style === "success" ? " selected" : "") + '>success</option>' +
      '<option value="danger"' + (style === "danger" ? " selected" : "") + '>danger</option></select></div>' +
      '<div class="field"><label>Emoji id</label><input data-k="icon_' + k + '" value="' + icon + '" style="width:100%"></div></div>';
    box.appendChild(div);
  });
}

$("btnSaveLinks").onclick = async () => {
  try {
    await api("/api/settings/bulk", { method: "POST", body: JSON.stringify({ items: {
      affiliate_link_base: $("affiliate_link_base").value,
      vip_group_link: $("vip_group_link").value,
      min_deposit: $("min_deposit").value,
      public_channel: $("public_channel").value,
      site_id: $("site_id").value,
      welcome_photo_url: $("welcome_photo_url").value,
    }})});
    toast("Saved");
  } catch (e) { alert(e.message); }
};
$("btnSaveButtons").onclick = async () => {
  try {
    const items = {};
    document.querySelectorAll("#buttonsBox [data-k]").forEach((el) => { items[el.getAttribute("data-k")] = el.value; });
    await api("/api/settings/bulk", { method: "POST", body: JSON.stringify({ items }) });
    toast("Saved");
  } catch (e) { alert(e.message); }
};

function loadMsgEditor() {
  const sk = "msg_" + $("msgKey").value + "_" + $("msgLang").value;
  $("msgValue").value = messagesCache[sk] || "";
  $("msgSource").textContent = "Source: " + (messagesCache[sk + "__source"] || "-");
  $("msgPreview").innerHTML = renderTgHtml($("msgValue").value);
}
$("msgKey").onchange = loadMsgEditor;
$("msgLang").onchange = loadMsgEditor;
$("msgValue").oninput = () => { $("msgPreview").innerHTML = renderTgHtml($("msgValue").value); };
$("btnWrapBold").onclick = () => {
  const ta = $("msgValue"); const a = ta.selectionStart, b = ta.selectionEnd;
  const sel = ta.value.slice(a, b) || "text";
  ta.value = ta.value.slice(0, a) + "<b>" + sel + "</b>" + ta.value.slice(b);
  ta.dispatchEvent(new Event("input"));
};
$("btnWrapCode").onclick = () => {
  const ta = $("msgValue"); const a = ta.selectionStart, b = ta.selectionEnd;
  const sel = ta.value.slice(a, b) || "code";
  ta.value = ta.value.slice(0, a) + "<code>" + sel + "</code>" + ta.value.slice(b);
  ta.dispatchEvent(new Event("input"));
};
$("btnSaveMsg").onclick = async () => {
  try {
    await api("/api/messages", { method: "POST", body: JSON.stringify({
      key: $("msgKey").value, lang: $("msgLang").value, value: $("msgValue").value,
    })});
    toast("Saved");
    await loadAll();
  } catch (e) { alert(e.message); }
};

$("btnAiGen").onclick = async () => {
  try {
    const data = await api("/api/ai/caption", { method: "POST", body: JSON.stringify({
      topic: $("aiTopic").value, lang: $("aiLang").value, tone: $("aiTone").value,
      include_tg_emoji: $("aiPrem").checked,
    })});
    $("aiOut").value = data.html || "";
    $("aiPreview").innerHTML = renderTgHtml(data.html || "");
    toast("OK");
  } catch (e) { alert(e.message); }
};
$("aiOut").oninput = () => { $("aiPreview").innerHTML = renderTgHtml($("aiOut").value); };
$("btnAiToWelcome").onclick = () => {
  document.querySelector('[data-tab="messages"]').click();
  $("msgKey").value = "welcome";
  $("msgLang").value = $("aiLang").value;
  $("msgValue").value = $("aiOut").value;
  loadMsgEditor();
};

async function loadStats() {
  const s = await api("/api/stats");
  $("statsBox").innerHTML =
    "<div><div class=\"muted\">Users</div><div class=\"stat\">" + s.total_users + "</div></div>" +
    "<div><div class=\"muted\">Verified</div><div class=\"stat\">" + s.verified + "</div></div>" +
    "<div><div class=\"muted\">Joined</div><div class=\"stat\">" + s.joined + "</div></div>" +
    "<div><div class=\"muted\">Postbacks</div><div class=\"stat\">" + s.postbacks + "</div></div>";
  const u = await api("/api/users?limit=40");
  $("usersBody").innerHTML = (u.users || []).map((x) =>
    "<tr><td><code>" + x.telegram_id + "</code></td><td>" +
    (x.full_name || x.username || "-") + "</td><td>" + (x.trader_id || "-") +
    "</td><td>$" + Number(x.total_deposit || 0).toFixed(2) +
    "</td><td>" + (x.is_verified ? "Yes" : "No") +
    "</td><td>" + (x.has_joined ? "Yes" : "No") + "</td></tr>"
  ).join("");
}

async function loadAll() {
  const data = await api("/api/settings");
  fillLinks(data);
  fillButtons(data);
  const msgs = await api("/api/messages");
  messagesCache = msgs.messages || {};
  $("msgKey").innerHTML = (msgs.keys || []).map((k) => "<option value=\"" + k + "\">" + k + "</option>").join("");
  setupEmojiBar();
  loadMsgEditor();
  await loadStats();
  toast("Loaded");
}

function showApp(statusText) {
  $("authStatus").textContent = statusText;
  $("authStatus").className = "ok";
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
}

function showGate(msg) {
  $("authStatus").textContent = msg;
  $("authStatus").className = "err";
  $("gateMsg").textContent = msg;
  $("gate").classList.remove("hidden");
  $("app").classList.add("hidden");
}

async function authTelegram() {
  $("authStatus").textContent = "Checking Telegram…";
  $("authStatus").className = "";

  const initData = await waitInitData(3000);
  const tg = getTg();

  if (!initData) {
    // try saved session with timeout
    if (sessionKey) {
      try {
        await api("/api/ping");
        showApp("Session OK");
        await loadAll();
        return;
      } catch (e) {
        localStorage.removeItem("admin_session");
        sessionKey = "";
      }
    }
    const hint = !tg
      ? "Telegram WebApp API নেই — বট থেকে /admin → Web App খুলুন"
      : "initData খালি — বটের Web App বাটন দিয়ে আবার খুলুন";
    showGate(hint);
    return;
  }

  try {
    $("authStatus").textContent = "Verifying admin…";
    const { res, data } = await fetchJson("/admin/api/auth/telegram", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ init_data: initData }),
    });
    if (!res.ok) {
      throw new Error(data.detail || ("HTTP " + res.status));
    }
    sessionKey = data.session;
    localStorage.setItem("admin_session", sessionKey);
    const u = data.user || {};
    showApp("✅ " + (u.first_name || "Admin") + " (" + u.id + ")");
    await loadAll();
  } catch (e) {
    const msg = (e && e.name === "AbortError")
      ? "Server timeout — Railway app চালু আছে?"
      : (e.message || "Auth failed");
    showGate(msg);
  }
}

$("btnLoad").onclick = () => loadAll().catch((e) => alert(e.message));
$("btnAuth").onclick = () => authTelegram();
$("btnRetry").onclick = () => authTelegram();

authTelegram();
</script>
</body>
</html>
